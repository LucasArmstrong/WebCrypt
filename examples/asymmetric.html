<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebCryptAsym — Asymmetric Example</title>
</head>
<body>
  <h1>WebCryptAsym — RSA Key Generation & Export</h1>
  <p>Generate an RSA keypair using <code>WebCryptAsym</code>, export the public key (SPKI, base64) and sign/verify a short message.</p>

  <button id="gen">Generate RSA Key Pair</button>
  <button id="sign">Sign Message</button>
  <pre id="out"></pre>

  <script type="module">
    import { WebCryptAsym } from '../src/WebCryptAsym.js';

    const asym = new WebCryptAsym();
    const out = document.getElementById('out');
    let keypair;

    function toBase64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    document.getElementById('gen').addEventListener('click', async () => {
      out.textContent = 'Generating RSA key pair (this may take a moment)...';
      keypair = await asym.generateKeyPair();
      const pubSpki = await crypto.subtle.exportKey('spki', keypair.publicKey);
      out.textContent = `PublicKey (SPKI, base64):\n${toBase64(pubSpki)}`;
    });

    document.getElementById('sign').addEventListener('click', async () => {
      if (!keypair) { out.textContent = 'Generate keys first.'; return; }
      const msg = new TextEncoder().encode('A short test message');
      // Use Web Crypt API directly for RSA-PSS signing if available
      const signature = await crypto.subtle.sign({ name: 'RSA-PSS', saltLength: 32 }, keypair.privateKey, msg);
      out.textContent = `Signature (base64):\n${toBase64(signature)}`;
    });
  </script>
</body>
</html>
